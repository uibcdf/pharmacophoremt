package:
  name: pharmacophoremt
  version: "{{ environ['MOLSYSSUITE_CONDA_VERSION'] }}"
source:
  path: ../../
build:
  number: {{ environ['MOLSYSSUITE_CONDA_BUILD_NUMBER'] }}
  string: py_{{ environ['MOLSYSSUITE_CONDA_BUILD_NUMBER'] }}
  noarch: python
requirements:
  host:
    - python >=3.11,<3.14
    - pip
    - setuptools >=61.0
    - versioningit ~=2.0
  run:
    - python >=3.11,<3.14
    - numpy
    - scipy
    - nglview
    - molsysmt
    - pyunitwizard
    - argdigest
    - rdkit
    - networkx
test:
  imports:
    - pharmacophoremt
  commands:
    - python -c "import importlib.metadata; assert importlib.metadata.version('pharmacophoremt') == '{{ environ['MOLSYSSUITE_CONDA_VERSION'] }}'"
about:
  home: https://uibcdf.org
  license: MIT License
  summary: ''
  description: 'This library...

    '
  dev_url: https://github.com/uibcdf/pharmacophoremt
  doc_url: https://uibcdf.org/pharmacophoremt
