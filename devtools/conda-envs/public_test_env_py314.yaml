# Public-provider receiving for #95; independent of controlled-source CI.
channels:
- uibcdf
- conda-forge
dependencies:
- python >=3.14,<3.15
- pip
- setuptools >=77.0.3
- versioningit >=2,<3
- pytest >=8
- pytest-receptor=1.1.0
- packaging
- numpy
- scipy
- nglview
- molsysmt
- pyunitwizard
- argdigest >=0.17.1
- smonitor
- depdigest
- rdkit
- networkx
- pyyaml >=5.1
# Existing installed-test integration inputs; observed versions, not API minima.
- molsysviewer ==0.24.0
- ackredit ==0.12.0
- beartype ==0.22.9
- openmm ==8.6.1
