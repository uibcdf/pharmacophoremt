# Python 3.11/3.12 use the same scientific dependencies as the native 3.13 lane.
# Controlled suite packages are installed from pinned sources in CI (#23).
channels:
- uibcdf
- conda-forge
- ambermd
dependencies:
- python >=3.11,<3.15
- pip
- setuptools >=68.0
- versioningit>=3.0
- h5py
- numpy
- pandas
- networkx
- tqdm
- matplotlib
- openmm
- pdbfixer
- ambertools
- openff-toolkit-base >=0.17.1
- openff-units >=0.3.0
- mdtraj
- mdanalysis
- rdkit
- parmed
- biopython
- ipywidgets
- py-mmcif >=1.1.1
- plotly
- anywidget
- aiohttp
- scikit-learn
- beartype
- packaging >=23
- pint
- pydantic
- pyyaml
- scipy
- traitlets >=5
- nglview
- pytest
- pytest-receptor=0.6.0
- pytest-cov
- codecov
- pytest-xdist
- ruff=0.16.5
