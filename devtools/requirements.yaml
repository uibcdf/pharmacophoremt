# Tooling only. pyproject.toml and reviewed contexts own Python/runtime.
setup:
  channels: &channels [uibcdf, conda-forge]
  dependencies: [setuptools, numpy] # NumPy retained as a build bootstrap tool.

production:
  channels: *channels
  dependencies: &production_tools [setuptools]

test:
  channels: *channels
  dependencies: &test_tools
    - *production_tools
    - pytest
    - pip
    - pytest-cov
    - codecov

docs:
  channels: *channels
  dependencies: &docs_tools
    - *production_tools
    - jupyterlab
    - sphinx
    - pydata-sphinx-theme
    - sphinxcontrib-bibtex
    - sphinx-remove-toctrees
    - sphinx-copybutton
    - sphinx-design
    - sphinx-favicon
    - sphinx-tabs
    - myst-nb

development:
  channels: *channels
  dependencies:
    - *test_tools
    - *docs_tools
    - mamba

conda-build:
  channels: *channels
  dependencies: [anaconda-client, conda-build]
